name = "enquote-sync"
main = "src/index.js"
compatibility_date = "2026-09-25"
usage_model = "standard"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "enquote-sync"
database_id = "05a146fb-bba9-43a3-a2fe-40473037d19f"

# Queue binding
[[queues.producers]]
binding = "OUTBOUND_QUEUE"
queue = "enquote-outbound"

# Cron trigger — reconciliation every 15 minutes
[triggers]
crons = ["*/15 * * * *"]

# Plain text vars
[vars]
BASE44_API_URL = "https://enquote.base44.app"

# Observability
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Secrets (set via `wrangler secret put <NAME>`):
# - BASE44_API_KEY
# - BASE44_APP_ID
# - ENQUOTE_LOCAL_SYNC_ENCRYPTION_KEY
# - ENQUOTE_LOCAL_SYNC_WEBHOOK_SECRET
# - OUTBOUND_TOKEN
# - SNAPSHOT_TOKEN
